config:
  cloud-init.user-data: |
    #cloud-config
    packages:
      - foot
      - neovim
      - fish
      - glxgears
      - ttf-bitstream-vera
      - ttf-dejavu
      - ttf-liberation
      - ttf-meslo-nerd
      - ttf-opensans
      - freetype2
      - cantarell-fonts
      - opendesktop-fonts
      - adobe-source-han-sans-cn-fonts
      - adobe-source-han-sans-jp-fonts
      - adobe-source-han-sans-kr-fonts
      - awesome-terminal-fonts
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal
      - dbus-glib
      - kdbusaddons
      - libdbusmenu-glib
      - libdbusmenu-gtk3
      - sdbus-cpp
    runcmd:
      - mkdir -p /home/chicken/.local/share/osu
      - chown -R chicken:chicken /home/chicken/.local
description: osu! packages and guest directories. Use scripts/apply-osu-profile.sh to add a host osu data mount.
devices: {}
