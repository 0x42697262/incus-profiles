config:
  cloud-init.vendor-data: |
    #cloud-config
    write_files:
      - path: /etc/profile.d/incus-wayland.sh
        permissions: '0644'
        content: |
          /usr/local/bin/incus-wayland-runtime >/dev/null 2>&1 || true

          export XDG_RUNTIME_DIR=/run/user/1000
          export WAYLAND_DISPLAY=wayland-0
          export DISPLAY=:0
          export XDG_SESSION_TYPE=wayland
          export QT_QPA_PLATFORM=wayland
      - path: /usr/local/bin/incus-wayland-runtime
        permissions: '0755'
        content: |
          #!/bin/sh
          set -eu

          install -d -m 0700 -o chicken -g chicken /run/user/1000
          install -d -m 1777 /tmp/.X11-unix

          [ -S /mnt/.sockets/wayland ] && ln -sf /mnt/.sockets/wayland /run/user/1000/wayland-0
          [ -S /mnt/.sockets/X0 ] && ln -sf /mnt/.sockets/X0 /tmp/.X11-unix/X0
    runcmd:
      - /usr/local/bin/incus-wayland-runtime
description: Container-side Wayland defaults. Host socket devices should be generated by scripts/apply-gui-profile.sh.
devices:
  graphics:
    gid: "1000"
    type: gpu
    uid: "1000"
