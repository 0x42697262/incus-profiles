config:
  cloud-init.vendor-data: |
    #cloud-config
    write_files:
      - path: /etc/profile.d/incus-audio.sh
        permissions: '0644'
        content: |
          /usr/local/bin/incus-audio-runtime >/dev/null 2>&1 || true

          export XDG_RUNTIME_DIR=/run/user/1000
          export PULSE_SERVER=unix:/run/user/1000/pulse/native
          export PIPEWIRE_REMOTE=pipewire-0
      - path: /usr/local/bin/incus-audio-runtime
        permissions: '0755'
        content: |
          #!/bin/sh
          set -eu

          install -d -m 0700 -o chicken -g chicken /run/user/1000
          install -d -m 0755 -o chicken -g chicken /run/user/1000/pulse

          [ -S /mnt/.sockets/pipewire-0 ] && ln -sf /mnt/.sockets/pipewire-0 /run/user/1000/pipewire-0
          [ -S /mnt/.sockets/pulse-native ] && ln -sf /mnt/.sockets/pulse-native /run/user/1000/pulse/native
    runcmd:
      - /usr/local/bin/incus-audio-runtime
description: Container-side audio defaults. Host socket devices should be generated by scripts/apply-gui-profile.sh.
devices: {}
